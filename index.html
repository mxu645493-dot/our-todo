<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="我们俩的待办">
<meta name="theme-color" content="#f5f7fb">
<title>我们俩的待办</title>
<link rel="apple-touch-icon" id="touch-icon" href="">
<style>
:root{--bg:#f5f7fb;--surface:#fff;--text:#1e2b44;--muted:#748096;--line:#e5eaf2;--blue:#2454ce;--pale:#edf3ff;--green:#277761;--red:#b34343}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;-webkit-text-size-adjust:100%}
main{max-width:640px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:12px;margin:8px 0 18px}
header img{width:44px;height:44px;border-radius:12px}
header h1{font-size:1.35rem;margin:0}
header p{margin:3px 0 0;font-size:.8rem;color:var(--muted)}
header .spacer{flex:1}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.panel+.panel{margin-top:16px}
h2{font-size:1rem;margin:0}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.muted{color:var(--muted);font-size:.8rem}
progress{appearance:none;-webkit-appearance:none;width:100%;height:6px;border:0;border-radius:6px;background:#edf1f7;overflow:hidden;display:block;margin-bottom:14px}
progress::-webkit-progress-bar{background:#edf1f7}
progress::-webkit-progress-value{background:#547ad6;border-radius:6px}
form.add{display:flex;gap:8px;margin-bottom:6px}
input{font:inherit;font-size:16px;border:1px solid #dce3ed;border-radius:10px;padding:12px;background:#fff;color:var(--text);min-width:0}
form.add input{flex:1}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid transparent;padding:11px 16px;font-size:.9rem;font-weight:600}
.primary{background:var(--blue);color:#fff}
.secondary{background:#fff;border-color:var(--line);color:var(--text)}
.link{background:none;border:0;color:var(--blue);padding:6px 4px;font-weight:500}
.link.danger{color:var(--red)}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #f0f3f7}
.row:last-child{border-bottom:0}
.row input[type=checkbox]{width:24px;height:24px;margin:0;flex-shrink:0;accent-color:var(--green)}
.text{flex:1;min-width:0}
.text.open-detail{cursor:pointer}
.title{font-size:1rem;line-height:1.5;overflow-wrap:anywhere}
.meta{font-size:.75rem;color:var(--muted);margin-top:2px}
.chip{display:inline-block;background:#fdf1e4;color:#9a5a1c;border-radius:6px;padding:1px 7px;margin-right:6px;font-weight:600}
.chip.all{background:#eaf5ef;color:var(--green)}
.arrow{color:#b8c2d1;font-size:1.2rem;padding:0 2px;cursor:pointer}
.row.done .title{text-decoration:line-through;color:var(--muted)}
.actions{display:flex;align-items:center;flex-shrink:0}
.edit{flex:1}
.empty{color:var(--muted);font-size:.9rem;padding:14px 0 4px}
.login label{display:block;font-size:.85rem;color:#53647a;margin:12px 0 6px}
.login input{width:100%}
.login button{width:100%;margin-top:18px}
.error{color:var(--red);font-size:.85rem;margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1e2b44;color:#fff;padding:10px 16px;border-radius:10px;font-size:.85rem}
.sync{font-size:.72rem;color:var(--muted);text-align:center;margin-top:14px}
.back{background:none;border:0;color:var(--blue);padding:4px 0;font-size:1rem;font-weight:500;margin-bottom:10px}
.detail-title{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.detail-title input[type=checkbox]{width:26px;height:26px;margin:0;accent-color:var(--green)}
.detail-title h2{font-size:1.25rem;overflow-wrap:anywhere}
.detail-title.done h2{text-decoration:line-through;color:var(--muted)}
.hint{font-size:.8rem;color:var(--muted);margin:2px 0 14px}
.group{border-bottom:1px solid #f0f3f7}
.group .group-head{border-bottom:0}
.group.all .group-head .title{text-decoration:line-through;color:var(--muted)}
.group-list{margin:0 0 12px 36px;padding:2px 12px 8px;background:#fffaf4;border:1px solid #f1e6d8;border-radius:12px}
.row.sub{padding:9px 0}
.row.sub input[type=checkbox]{width:20px;height:20px}
.sub-add{margin-top:8px}
.sub-add input{padding:9px 10px;font-size:16px}
.sub-add button{padding:9px 14px}
.moon-toggle{background:#f6f0fb;color:#6b46b8;border:1px solid #e6dcf5;border-radius:20px;padding:7px 12px;font-size:.85rem;font-weight:600}
.moon-panel{margin-bottom:16px;border-color:#e6dcf5;background:linear-gradient(180deg,#fbf8fe,#fff 90px)}
.moon-line{margin:2px 0 6px;font-size:.95rem}
.moon-next{margin:4px 0 6px;font-size:1.05rem;font-weight:700;color:#6b46b8}
.moon-meta{margin:2px 0 10px;font-size:.78rem;color:var(--muted)}
.moon-form{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0}
.moon-form input{padding:8px 10px;font-size:16px}
.moon-label{font-size:.85rem;color:#53647a}
.moon-btn{background:#6b46b8;color:#fff;padding:9px 14px}
.moon-history{border-top:1px dashed #e6dcf5;margin-top:10px;padding-top:8px}
.moon-row{display:flex;justify-content:space-between;align-items:center;font-size:.88rem;padding:4px 0}
.moon-del{background:none;border:0;color:var(--red);padding:4px 6px;font-weight:500}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
 <header><img id="logo" alt=""><div><h1>我们俩的待办</h1><p>所爱隔山海，山海亦可平</p></div><span class="spacer"></span><button class="moon-toggle" id="moon-toggle" type="button" hidden aria-expanded="false">🌙 小月亮 <span id="moon-sign">＋</span></button><button class="link" id="logout" hidden>退出</button></header>
 <section class="panel moon-panel" id="moon" hidden></section>
 <section class="panel login" id="login" hidden>
  <h2>登录</h2>
  <p class="muted">用你们各自的邮箱和密码登录。账号由小熊在后台建好。</p>
  <form id="login-form">
   <label for="email">邮箱</label><input id="email" type="email" autocomplete="username" required>
   <label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required>
   <button class="primary" type="submit">登录</button>
   <p class="error" id="login-error" hidden></p>
  </form>
 </section>
 <section id="app" hidden>
  <div class="panel">
   <div class="head"><h2>还没做的</h2><span class="muted" id="count"></span></div>
   <progress id="bar" max="1" value="0"></progress>
   <form class="add" id="add-form"><input id="new" maxlength="200" placeholder="写一件要一起做的事，按回车" aria-label="新的共同待办"><button class="primary" type="submit">添加</button></form>
   <p class="hint">点一件事（比如一个超市）进去，可以分品类（比如一道菜），再列出每样要买的东西。</p>
   <div id="open-list"></div>
  </div>
  <div class="panel">
   <div class="head"><h2>做完了</h2><button class="link" id="toggle-done"></button></div>
   <div id="done-list"></div>
  </div>
 </section>
 <section id="detail" hidden>
  <button class="back" id="back" type="button">‹ 返回</button>
  <div class="panel">
   <div class="detail-title" id="detail-title"><input type="checkbox" id="detail-done" aria-label="整件事完成"><h2 id="detail-name"></h2></div>
   <p class="meta" id="detail-meta"></p>
   <div class="head" style="margin-top:14px"><h2>要买的</h2><span class="muted" id="item-count"></span></div>
   <progress id="item-bar" max="1" value="0"></progress>
   <form class="add" id="item-form"><input id="item-new" maxlength="200" placeholder="加一个品类（比如：红烧肉），或直接加一样东西" aria-label="新的品类或东西"><button class="primary" type="submit">添加</button></form>
   <div id="item-list"></div>
  </div>
 </section>
 <p class="sync" id="sync"></p>
</main>
<div class="toast" id="toast" hidden></div>
<script>
'use strict';
const URL_BASE='https://cnupmfuxomfrmhbqojcf.supabase.co';
const KEY='sb_publishable_err7Esvh43jYx7nlrPy1Gg_qSy4i-EV';
const STORE='our-todo.session';
const $=s=>document.querySelector(s);
let moonRows=[],moonOpen=false;
let session=null,todos=[],lastJson='',showAllDone=false,editingId=null,openId=null,busy=false,toastTimer;
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;}
function toast(t){clearTimeout(toastTimer);$('#toast').textContent=t;$('#toast').hidden=false;toastTimer=setTimeout(()=>$('#toast').hidden=true,3000);}
function load(){try{return JSON.parse(localStorage.getItem(STORE));}catch(_){return null;}}
function store(s){session=s;try{s?localStorage.setItem(STORE,JSON.stringify(s)):localStorage.removeItem(STORE);}catch(_){}}
async function auth(path,body){
 const r=await fetch(URL_BASE+'/auth/v1/'+path,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
 const d=await r.json().catch(()=>({}));
 if(!r.ok)throw new Error(d.error_description||d.msg||d.message||'登录失败，请检查邮箱和密码。');
 return {access_token:d.access_token,refresh_token:d.refresh_token,expires_at:Math.floor(Date.now()/1000)+(d.expires_in||3600),email:(d.user&&d.user.email||'').toLowerCase()};
}
async function token(){
 if(!session)throw new Error('请先登录。');
 if(session.expires_at-60<Date.now()/1000){
  try{store(await auth('token?grant_type=refresh_token',{refresh_token:session.refresh_token}));}
  catch(e){store(null);show();throw new Error('登录已过期，请重新登录。');}
 }
 return session.access_token;
}
async function api(method,table,query,body){
 const r=await fetch(URL_BASE+'/rest/v1/'+table+query,{method,headers:{apikey:KEY,Authorization:'Bearer '+await token(),'Content-Type':'application/json',Prefer:'return=representation'},body:body?JSON.stringify(body):undefined});
 if(r.status===401){store(null);show();throw new Error('登录已过期，请重新登录。');}
 const d=await r.json().catch(()=>null);
 if(!r.ok)throw new Error((d&&d.message)||'没有保存成功，请检查网络后再试。');
 return d;
}
// 🌙 小月亮：日期记录与预测。手机网页和工作台共用这段逻辑（没有反引号和反斜杠，方便贴到网页里）。
function moonDays(a,b){const p=s=>{const x=s.split('-').map(Number);return Date.UTC(x[0],x[1]-1,x[2]);};return Math.round((p(b)-p(a))/864e5);}
function moonAdd(d,n){const x=d.split('-').map(Number);const t=new Date(Date.UTC(x[0],x[1]-1,x[2]+n));return t.toISOString().slice(0,10);}
function moonToday(){const t=new Date();return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');}
function moonLabel(d){const x=d.split('-').map(Number);return x[1]+'月'+x[2]+'日';}
function moonStats(rows){
 const list=rows.slice().sort((a,b)=>a.start_date.localeCompare(b.start_date));
 const gaps=[];for(let i=1;i<list.length;i++){const g=moonDays(list[i-1].start_date,list[i].start_date);if(g>=15&&g<=60)gaps.push(g);}
 const recent=gaps.slice(-6),cycle=recent.length?Math.round(recent.reduce((s,g)=>s+g,0)/recent.length):28;
 const lens=list.filter(r=>r.end_date).map(r=>moonDays(r.start_date,r.end_date)+1).slice(-6),len=lens.length?Math.round(lens.reduce((s,g)=>s+g,0)/lens.length):5;
 const last=list[list.length-1]||null,today=moonToday();
 const next=last?moonAdd(last.start_date,cycle):null;
 return {list,last,cycle,len,basedOn:recent.length,next,nextEnd:next?moonAdd(next,len-1):null,untilNext:next?moonDays(today,next):null,dayOf:last?moonDays(last.start_date,today)+1:null,today};
}
function moonPanel(rows,ui){
 // ui: {el, btn, act, insert(start), update(id,patch), remove(id)}
 const s=moonStats(rows),el=ui.el,box=el('div','moon-box');
 if(!s.last){box.append(el('p','moon-line','还没有记录。记下第一次开始的日期，下次就能帮你预测。'));}
 else{
  const ongoing=!s.last.end_date&&s.dayOf<=12;
  box.append(el('p','moon-line','上次开始：'+moonLabel(s.last.start_date)+(s.last.end_date?'，持续 '+(moonDays(s.last.start_date,s.last.end_date)+1)+' 天':ongoing?'，今天是第 '+s.dayOf+' 天':'')));
  const until=s.untilNext;
  box.append(el('p','moon-next','下次大约：'+moonLabel(s.next)+' ~ '+moonLabel(s.nextEnd)+(until>0?'（还有 '+until+' 天）':until===0?'（就是今天左右）':'（已经晚了 '+(-until)+' 天）')));
  box.append(el('p','moon-meta','平均间隔 '+s.cycle+' 天'+(s.basedOn?'（按最近 '+s.basedOn+' 次算）':'（记录还少，先按 28 天估计）')+' · 平均持续 '+s.len+' 天'));
  if(ongoing){
   const f=el('form','moon-form');const d=el('input');d.type='date';d.value=s.today;d.min=s.last.start_date;d.setAttribute('aria-label','结束日期');
   f.append(el('span','moon-label','这次结束：'),d,ui.btn('记录结束',()=>f.requestSubmit(),'moon-btn'));
   f.addEventListener('submit',e=>{e.preventDefault();if(!d.value)return;ui.act(()=>ui.update(s.last.id,{end_date:d.value}),'记好了');});box.append(f);
  }
 }
 const f=el('form','moon-form');const d=el('input');d.type='date';d.value=s.today;d.setAttribute('aria-label','开始日期');
 f.append(el('span','moon-label','这次开始：'),d,ui.btn('记录开始',()=>f.requestSubmit(),'moon-btn'));
 f.addEventListener('submit',e=>{e.preventDefault();if(!d.value)return;if(s.list.some(r=>r.start_date===d.value))return ui.act(async()=>{throw new Error('这一天已经记过了');});ui.act(()=>ui.insert(d.value),'记好了');});box.append(f);
 if(s.list.length){
  const h=el('div','moon-history');h.append(el('p','moon-meta','最近的记录'));
  s.list.slice(-6).reverse().forEach(r=>{const row=el('div','moon-row');row.append(el('span','',moonLabel(r.start_date)+(r.end_date?' – '+moonLabel(r.end_date)+'（'+(moonDays(r.start_date,r.end_date)+1)+' 天）':'')),ui.btn('删',()=>{if(confirm('删除 '+moonLabel(r.start_date)+' 这条记录？'))ui.act(()=>ui.remove(r.id),'已删除');},'moon-del'));h.append(row);});
  box.append(h);
 }
 return box;
}
const T='shared_todos',I='shared_todo_items',M='shared_moon';
function who(email){return !email?'':email===session.email?'我':'TA';}
function day(ts){if(!ts)return '';const d=new Date(ts);const t=new Date();const y=new Date(Date.now()-864e5);const k=x=>x.toDateString();return k(d)===k(t)?'今天':k(d)===k(y)?'昨天':(d.getMonth()+1)+'月'+d.getDate()+'日';}
function itemsOf(t){const all=t.shared_todo_items||[];return all.filter(x=>!all.some(y=>y.parent_id===x.id));}
async function refresh(){
 try{const data=await api('GET',T,'?select=*,shared_todo_items(*)&order=created_at.asc');let moon=moonRows;try{moon=await api('GET',M,'?select=*&order=start_date.asc');}catch(_){}const json=JSON.stringify([data,moon]);if(json!==lastJson){lastJson=json;todos=data;moonRows=moon;render();}$('#sync').textContent='已同步 · '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});}
 catch(e){$('#sync').textContent=e.message;}
}
async function act(fn,msg){if(busy)return;busy=true;try{await fn();await refresh();if(msg)toast(msg);}catch(e){toast(e.message);await refresh();}finally{busy=false;}}
function openDetail(id){openId=id;history.pushState({id},'','#item');render();window.scrollTo(0,0);}
function closeDetail(){if(location.hash==='#item')history.back();else{openId=null;render();}}
window.addEventListener('popstate',()=>{openId=null;render();});
function row(t){
 const r=el('div','row'+(t.done?' done':''));
 const c=el('input');c.type='checkbox';c.checked=t.done;c.setAttribute('aria-label','完成：'+t.title);
 c.addEventListener('change',()=>act(()=>api('PATCH',T,'?id=eq.'+t.id,{done:c.checked}),c.checked?'做完了！':'改回没做完'));
 r.append(c);
 if(editingId===t.id){
  const i=el('input','edit');i.value=t.title;i.maxLength=200;
  const save=()=>{const v=i.value.trim();if(!v)return toast('内容不能为空');editingId=null;act(()=>api('PATCH',T,'?id=eq.'+t.id,{title:v}),'已修改');};
  i.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();save();}if(e.key==='Escape'){editingId=null;render();}});
  const ok=el('button','link','保存');ok.type='button';ok.onclick=save;const no=el('button','link','取消');no.type='button';no.onclick=()=>{editingId=null;render();};
  r.append(i,ok,no);setTimeout(()=>i.focus(),0);return r;
 }
 const items=itemsOf(t),got=items.filter(x=>x.done).length;
 const x=el('div','text open-detail');x.append(el('div','title',t.title));
 const m=el('div','meta');if(items.length)m.append(el('span','chip'+(got===items.length?' all':''),'🛒 '+got+'/'+items.length));
 m.append(t.done?who(t.done_by)+'在'+day(t.done_at)+'完成':who(t.created_by)+'加的 · '+day(t.created_at));x.append(m);
 x.addEventListener('click',()=>openDetail(t.id));
 r.append(x);
 const a=el('div','actions');
 const e=el('button','link','改');e.type='button';e.onclick=()=>{editingId=t.id;render();};
 const d=el('button','link danger','删');d.type='button';d.onclick=()=>{if(confirm('删除「'+t.title+'」？里面的小清单也会一起删掉。'))act(()=>api('DELETE',T,'?id=eq.'+t.id),'已删除');};
 const g=el('span','arrow','›');g.addEventListener('click',()=>openDetail(t.id));
 a.append(e,d,g);r.append(a);return r;
}
const openGroups=new Set(),groupDrafts={};
function kids(t,pid){return (t.shared_todo_items||[]).filter(x=>(x.parent_id||null)===pid).sort((a,b)=>(a.done-b.done)||a.created_at.localeCompare(b.created_at));}
function leaves(t){const all=t.shared_todo_items||[];return all.filter(x=>!all.some(y=>y.parent_id===x.id));}
function delBtn(it,label){const d=el('button','link danger','删');d.type='button';d.onclick=()=>{if(!label||confirm(label))act(()=>api('DELETE',I,'?id=eq.'+it.id),'已删除');};return d;}
function itemRow(it,small){
 const r=el('div','row'+(it.done?' done':'')+(small?' sub':''));
 const c=el('input');c.type='checkbox';c.checked=it.done;c.setAttribute('aria-label','买到了：'+it.title);
 c.addEventListener('change',()=>act(()=>api('PATCH',I,'?id=eq.'+it.id,{done:c.checked}),c.checked?'勾上了':'改回没买'));
 const x=el('div','text');x.append(el('div','title',it.title),el('div','meta',it.done?who(it.done_by)+'在'+day(it.done_at)+'勾的':who(it.created_by)+'加的'));
 r.append(c,x);
 const a=el('div','actions');
 if(!small){const g=el('button','link','＋');g.type='button';g.title='在「'+it.title+'」下面再分几样';g.onclick=()=>{openGroups.add(it.id);render();setTimeout(()=>{const f=document.querySelector('[data-group="'+it.id+'"] input');if(f)f.focus();},0);};a.append(g);}
 a.append(delBtn(it));r.append(a);return r;
}
function groupBlock(t,g){
 const children=kids(t,g.id),got=children.filter(x=>x.done).length,all=children.length&&got===children.length;
 const open=openGroups.has(g.id);
 if(!children.length&&!open)return itemRow(g,false);
 const box=el('div','group'+(all?' all':''));
 const h=el('div','row group-head');
 const c=el('input');c.type='checkbox';c.checked=all;c.setAttribute('aria-label','整组买齐：'+g.title);
 c.addEventListener('change',()=>{const v=c.checked;act(async()=>{if(children.length)await api('PATCH',I,'?parent_id=eq.'+g.id,{done:v});await api('PATCH',I,'?id=eq.'+g.id,{done:v});},v?'这一组都买齐了':'改回没买齐');});
 const x=el('div','text open-detail');x.append(el('div','title',g.title));const m=el('div','meta');m.append(el('span','chip'+(all?' all':''),'🛒 '+got+'/'+children.length));m.append(open?'点这里收起':'点这里展开');x.append(m);
 x.addEventListener('click',()=>{open?openGroups.delete(g.id):openGroups.add(g.id);render();});
 const a=el('div','actions');a.append(delBtn(g,'删除「'+g.title+'」？里面的'+children.length+'样也会一起删掉。'),el('span','arrow',open?'⌄':'›'));
 h.append(c,x,a);box.append(h);
 if(open){
  const list=el('div','group-list');children.forEach(it=>list.append(itemRow(it,true)));
  const f=el('form','add sub-add');f.dataset.group=g.id;const i=el('input');i.maxLength=200;i.placeholder='给「'+g.title+'」加一样，比如：五花肉 500g';i.value=groupDrafts[g.id]||'';i.addEventListener('input',()=>{groupDrafts[g.id]=i.value;});
  const b=el('button','secondary','加');b.type='submit';f.append(i,b);
  f.addEventListener('submit',e=>{e.preventDefault();const v=(groupDrafts[g.id]||'').trim();if(!v){i.focus();return;}act(async()=>{await api('POST',I,'',{todo_id:t.id,parent_id:g.id,title:v});groupDrafts[g.id]='';},'已加进「'+g.title+'」').then(()=>{const again=document.querySelector('[data-group="'+g.id+'"] input');if(again)again.focus();});});
  list.append(f);box.append(list);
 }
 return box;
}
function renderDetail(t){
 $('#app').hidden=true;$('#detail').hidden=false;
 $('#detail-name').textContent=t.title;$('#detail-title').classList.toggle('done',t.done);$('#detail-done').checked=t.done;
 $('#detail-meta').textContent=t.done?who(t.done_by)+'在'+day(t.done_at)+'完成':who(t.created_by)+'加的 · '+day(t.created_at);
 const lv=leaves(t),got=lv.filter(x=>x.done).length,top=kids(t,null);
 for(const g of top)if(!groupDrafts.hasOwnProperty('seen'+g.id)){groupDrafts['seen'+g.id]=1;if(kids(t,g.id).some(x=>!x.done))openGroups.add(g.id);}
 $('#item-count').textContent=lv.length?'已买 '+got+' / '+lv.length:'';
 $('#item-bar').max=lv.length||1;$('#item-bar').value=got;
 $('#item-list').replaceChildren(...(top.length?top.map(g=>groupBlock(t,g)):[el('p','empty','还没有东西。先加一个品类（比如一道菜），或者直接加一样要买的东西。')]));
}
function renderMoon(){
 $('#moon-sign').textContent=moonOpen?'－':'＋';$('#moon-toggle').setAttribute('aria-expanded',String(moonOpen));$('#moon').hidden=!moonOpen;if(!moonOpen)return;
 const btn=(t,fn,cls)=>{const b=el('button',cls,t);b.type='button';b.addEventListener('click',fn);return b;};
 const head=el('div','head');head.append(el('h2','','🌙 小月亮'),el('span','muted','只有我们俩能看到'));
 $('#moon').replaceChildren(head,moonPanel(moonRows,{el,btn,act,insert:d=>api('POST',M,'',{start_date:d}),update:(id,patch)=>api('PATCH',M,'?id=eq.'+id,patch),remove:id=>api('DELETE',M,'?id=eq.'+id)}));
}
function render(){
 if(!session)return;
 renderMoon();
 const current=openId&&todos.find(t=>t.id===openId);
 if(openId&&!current){openId=null;if(location.hash==='#item')history.replaceState(null,'',location.pathname);}
 if(current)return renderDetail(current);
 $('#detail').hidden=true;$('#app').hidden=false;
 const open=todos.filter(t=>!t.done),done=todos.filter(t=>t.done).sort((a,b)=>(b.done_at||'').localeCompare(a.done_at||''));
 const week=Date.now()-7*864e5,recent=done.filter(t=>new Date(t.done_at).getTime()>=week),shown=showAllDone?done:recent;
 $('#count').textContent=todos.length?'已完成 '+done.length+' / '+todos.length:'';
 $('#bar').max=todos.length||1;$('#bar').value=done.length;
 $('#open-list').replaceChildren(...(open.length?open.map(row):[el('p','empty','都做完啦，写下一件要一起做的事吧。')]));
 $('#done-list').replaceChildren(...(shown.length?shown.map(row):[el('p','empty',done.length?'最近 7 天没有完成的事。':'还没有做完的事。')]));
 $('#toggle-done').textContent=done.length>recent.length?(showAllDone?'只看最近 7 天':'显示全部 '+done.length+' 项'):'';
}
function show(){
 const ok=!!session;$('#login').hidden=ok;$('#app').hidden=!ok;$('#detail').hidden=true;$('#logout').hidden=!ok;$('#moon-toggle').hidden=!ok;if(!ok)$('#moon').hidden=true;
 if(ok){lastJson='';refresh();}
}
$('#login-form').addEventListener('submit',async e=>{
 e.preventDefault();$('#login-error').hidden=true;
 try{store(await auth('token?grant_type=password',{email:$('#email').value.trim(),password:$('#password').value}));$('#password').value='';show();}
 catch(err){$('#login-error').textContent=/invalid/i.test(err.message)?'邮箱或密码不对，请再试一次。':err.message;$('#login-error').hidden=false;}
});
$('#add-form').addEventListener('submit',e=>{
 e.preventDefault();const v=$('#new').value.trim();if(!v)return;
 act(async()=>{await api('POST',T,'',{title:v});$('#new').value='';},'已添加').then(()=>$('#new').focus());
});
$('#item-form').addEventListener('submit',e=>{
 e.preventDefault();const v=$('#item-new').value.trim();if(!v||!openId)return;const id=openId;
 act(async()=>{await api('POST',I,'',{todo_id:id,title:v});$('#item-new').value='';},'已添加，点右边 ＋ 可以在它下面再分几样').then(()=>$('#item-new').focus());
});
$('#detail-done').addEventListener('change',()=>{const t=todos.find(x=>x.id===openId);if(t)act(()=>api('PATCH',T,'?id=eq.'+t.id,{done:$('#detail-done').checked}),$('#detail-done').checked?'整件事做完了！':'改回没做完');});
$('#back').addEventListener('click',closeDetail);
$('#moon-toggle').addEventListener('click',()=>{moonOpen=!moonOpen;renderMoon();});
$('#toggle-done').addEventListener('click',()=>{showAllDone=!showAllDone;render();});
$('#logout').addEventListener('click',()=>{if(confirm('退出登录？'))fetch(URL_BASE+'/auth/v1/logout',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+(session&&session.access_token)}}).catch(()=>{}).finally(()=>{store(null);todos=[];openId=null;show();});});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&session&&!editingId)refresh();});
setInterval(()=>{const a=document.activeElement;const typing=a&&a.tagName==='INPUT'&&a.type!=='checkbox';if(document.visibilityState==='visible'&&session&&!editingId&&!busy&&!typing)refresh();},15000);
const BEAR='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><circle cx="15" cy="17" r="10" fill="#b0784a"/><circle cx="49" cy="17" r="10" fill="#b0784a"/><circle cx="15" cy="17" r="5" fill="#f0cfa8"/><circle cx="49" cy="17" r="5" fill="#f0cfa8"/><circle cx="32" cy="36" r="23" fill="#c68c5c"/><ellipse cx="32" cy="44" rx="11" ry="8.5" fill="#f5dcbf"/><circle cx="22.5" cy="32" r="3.2" fill="#3a2a20"/><circle cx="41.5" cy="32" r="3.2" fill="#3a2a20"/><circle cx="23.6" cy="30.9" r="1" fill="#fff"/><circle cx="42.6" cy="30.9" r="1" fill="#fff"/><ellipse cx="32" cy="40.5" rx="4.2" ry="3" fill="#3a2a20"/><path d="M32 43.5v2.5M28 47.2q4 3 8 0" stroke="#3a2a20" stroke-width="1.8" fill="none" stroke-linecap="round"/><circle cx="17" cy="42" r="3.6" fill="#f09a9a" opacity=".55"/><circle cx="47" cy="42" r="3.6" fill="#f09a9a" opacity=".55"/></svg>';
(function(){const svgUrl='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(BEAR);$('#logo').src=svgUrl;
 const img=new Image();img.onload=function(){const c=document.createElement('canvas');c.width=c.height=180;const g=c.getContext('2d');g.fillStyle='#fdf6ee';g.fillRect(0,0,180,180);g.drawImage(img,14,14,152,152);const png=c.toDataURL('image/png');$('#touch-icon').href=png;const fav=document.createElement('link');fav.rel='icon';fav.href=png;document.head.append(fav);};img.src=svgUrl;})();
if(location.hash==='#item')history.replaceState(null,'',location.pathname);
session=load();show();
</script>
